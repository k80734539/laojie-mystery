<style>
html,body,button,.btn,.hot,#box{touch-action:manipulation}
#log{position:absolute;inset:0;z-index:12;background:rgba(0,0,0,.9);display:none;flex-direction:column;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}#log h2{color:#f5c26b;text-align:center;margin:4px 0 10px;font-size:20px}#logl{flex:1;overflow:auto;font-size:15px;line-height:1.55;-webkit-overflow-scrolling:touch}#logl p{margin:0 0 10px;white-space:pre-wrap}#logl b{color:#ffd77a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden}
#app{position:relative;margin:0 auto;height:100%;max-width:56.25vh;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s,filter .5s}
#rain{position:absolute;inset:0;pointer-events:none}
#por{position:absolute;left:50%;bottom:23%;height:62%;transform:translateX(-50%);transition:opacity .25s,transform .25s;opacity:0;filter:drop-shadow(0 0 12px rgba(0,0,0,.7))}
#por.on{opacity:1}
#por.shake{animation:pshake .4s}
@keyframes pshake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(-56%)}40%{transform:translateX(-44%)}60%{transform:translateX(-53%)}80%{transform:translateX(-47%)}}
#app.shake{animation:ashake .45s}
@keyframes ashake{0%,100%{transform:none}25%{transform:translate(-8px,4px)}50%{transform:translate(7px,-5px)}75%{transform:translate(-4px,3px)}}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(#000a,#0000);z-index:5}
#place{font-weight:bold;letter-spacing:2px;text-shadow:0 2px 4px #000}
#hearts{font-size:18px}
.hb{background:#c0392b;border:2px solid #f5c26b;color:#fff;border-radius:18px;padding:6px 12px;font-size:14px;font-weight:bold;margin-left:6px}
#hs{position:absolute;inset:0;z-index:2}
.hot{position:absolute;border:2px dashed rgba(255,215,120,.8);border-radius:12px;background:rgba(255,200,80,.12);animation:glow 1.6s infinite;display:flex;align-items:flex-end;justify-content:center}
.hot span{font-size:12px;background:#000b;padding:2px 6px;border-radius:6px;margin-bottom:-12px;white-space:nowrap}
.hot.done{border-color:rgba(160,160,160,.5);background:none;animation:none}
@keyframes glow{50%{background:rgba(255,200,80,.3);box-shadow:0 0 14px #fc6}}
#box{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));min-height:21%;background:rgba(10,12,30,.88);border:2px solid #f5c26b;border-radius:14px;padding:22px 16px 14px;z-index:6;display:none;font-size:17px;line-height:1.6}
#name{position:absolute;top:-14px;left:12px;background:#b03a2e;border:2px solid #f5c26b;padding:2px 14px;border-radius:10px;font-weight:bold;font-size:15px}
#name:empty{display:none}
#txt{white-space:pre-wrap;min-height:3.2em}
#txt.test{color:#7fe08a}
#nxt{position:absolute;right:12px;bottom:6px;animation:bob 1s infinite;color:#f5c26b}
@keyframes bob{50%{transform:translateY(4px)}}
#bar{position:absolute;left:0;right:0;bottom:0;display:none;gap:6px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d 30%);z-index:4;flex-wrap:wrap;justify-content:center}
.btn{flex:1;min-width:28%;background:linear-gradient(#3a4a8a,#22295a);border:2px solid #f5c26b;color:#fff;border-radius:12px;padding:12px 6px;font-size:16px;font-weight:bold;text-align:center}
.btn.red{background:linear-gradient(#d0452f,#8a1f14)}
.btn:active{transform:scale(.96)}
#tbar{position:absolute;left:8px;right:8px;display:none;gap:6px;z-index:7}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.82);z-index:10;display:none;flex-direction:column;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
#modal h2{margin:4px 0 10px;color:#f5c26b;font-size:20px;text-align:center}
#mlist{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.ev{background:#1d2347;border:2px solid #556;border-radius:10px;padding:8px;font-size:14px;min-height:64px}
.ev b{display:block;color:#ffd77a;margin-bottom:2px;font-size:15px}

.ev.sel{border-color:#f5c26b;background:#3a2f17}

#mbtns{display:flex;gap:8px}
#flash{position:absolute;inset:0;z-index:20;pointer-events:none;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 0,#ffd 30%,#f90 60%,#a00 100%)}

#title{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18%;background:linear-gradient(#0000 30%,#000c)}
#title h1{font-size:13vw;font-size:min(13vw,7vh);margin:0;letter-spacing:6px;color:#ffe3a0;text-shadow:0 0 18px #f60,0 4px 0 #600}

#chap{position:absolute;inset:0;z-index:14;display:none;align-items:center;justify-content:center;background:#000;font-size:26px;letter-spacing:4px;color:#ffe3a0;text-align:center;line-height:1.8}
.accuse{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;align-content:center}
.sus{border:2px solid #f5c26b;border-radius:12px;overflow:hidden;background:#1d2347;text-align:center;font-weight:bold;padding-bottom:6px}
.sus img{width:100%;height:28vh;object-fit:cover;object-position:top}

let AC=null,rainNode=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();startRain()}if(AC.state==='suspended')AC.resume();if(!bgmCur)setBGM('inv');return AC}
function tone(f,d,type='square',v=.05,slide=0){if(!AC)return;if(v>.03)duck();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function noise(d,v=.3,f=1000){if(!AC)return;duck();const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.frequency.value=f;const g=AC.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start()}
function startRain(){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=AC.createGain();g.gain.value=.05;s.connect(f).connect(g).connect(AC.destination);s.start();rainNode=g}

function note(th,m,t,d,type,v,o={}){const c=AC,os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(mtof(m),t);
 if(o.slide)os.frequency.setValueAtTime(mtof(m-1),t),os.frequency.linearRampToValueAtTime(mtof(m),t+.08);
 let n=os;if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);n=f}
 if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.5;lg.gain.value=mtof(m)*.012;l.connect(lg).connect(os.frequency);l.start(t);l.stop(t+d+.3)}
 const a=o.a||.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);
 if(o.sus){g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d)}else g.gain.exponentialRampToValueAtTime(.0001,t+d);
 n.connect(g).connect(TH[th].g);os.start(t);os.stop(t+d+.05)}
function drum(th,t,kind,v){const c=AC;if(kind==='k'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(TH[th].g);o.start(t);o.stop(t+.25);return}
 const len=kind==='s'?.15:.04,b=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f).connect(g).connect(TH[th].g);s.start(t)}

function play8(th,s,t){const e=30/{inv:INV,test:TST,final:FIN}[th].bpm;
 if(th==='inv'){const ch=INV.chords[Math.floor(s/16)%4];// guitar arpeggio
  const ar=[0,1,2,1];note(th,ch[ar[s%4]]+12,t,1.2,'triangle',.06,{lp:2000});if(s%16===0)ch.forEach(m=>note(th,m,t,e*16,'sine',.025,{a:.8,sus:1}));
  const m=INV.lead[s%INV.lead.length];if(m)note(th,m,t,e*2.6,'sawtooth',.045,{lp:1500,vib:1,a:.09,sus:1,slide:1})}
 else if(th==='test'){const b=TST.bass[s%8];note(th,b,t,e*.9,'sawtooth',.07,{lp:500});if(s%2)drum(th,t,'h',.05);
  const m=TST.stab[s%16];if(m)note(th,m,t,e*.6,'square',.035,{lp:2200});if(s%32===0)note(th,57,t,e*32,'sine',.03,{a:1,sus:1})}
 else {const b=FIN.bass[s%16];note(th,b,t,e*.8,'sawtooth',.08,{lp:900});if(s%4===0)drum(th,t,'k',.5);if(s%4===2)drum(th,t,'s',.25);drum(th,t,'h',.04);
  const m=FIN.lead[s%FIN.lead.length];if(m)note(th,m,t,e*1.5,'square',.04,{lp:3500,vib:1})}}

// round: {who, lines:[{t,e,press:[[who,t,e]...]}], answer:{i, ev:[...]}, onWrong}
async function crossExam(who,title,r){
 let i=0;setBGM(S.flags.final?'final':'test');
 await N(`—— ${title} ——\n（點「追問」逼問細節，發現矛盾就按「出示」證物！）`);
 while(true){
  const L=r.lines[i];
  hideBox();
  await say(who,`「${L.t}」`,L.e||'normal',{test:true,noWait:true,tag:`．證詞 ${i+1}/${r.lines.length}`});
  const tb=$('#tbar');
  const v=await new Promise(res=>{tb.innerHTML='';tb.style.display='flex';tb.style.bottom=(box.offsetHeight+18)+'px';
   let done=false;[['◀ 上一句','prev'],['追問','press'],['出示','present','red'],['下一句 ▶','next']].forEach(([l,val,c])=>{const x=document.createElement('button');x.type='button';x.className='btn '+(c||'');x.style.minWidth='0';x.style.flex=1;x.style.padding='14px 2px';x.style.fontSize='15px';x.textContent=l;x.dataset.v=val;onTap(x,()=>{if(done)return;done=true;ac();SFX.tap();tb.style.display='none';res(val)});tb.appendChild(x)})});
  if(v==='prev'){i=(i-1+r.lines.length)%r.lines.length;continue}
  if(v==='next'){i++;if(i>=r.lines.length){i=0;await N('（證詞又繞回第一句了。哪一句跟證物對不上？）')}continue}
  if(v==='press'){await flash('等一下！');for(const p of (L.press||[[who,'……就是這樣，沒什麼好說的。']]))await say(p[0],p[1],p[2]);continue}
  if(v==='present'){busyModal=true;const k=await evModal('要出示哪一個證物？',true);busyModal=false;if(!k)continue;
   if(i===r.answer.i&&r.answer.ev.includes(k)){await flash('就是這個！');return k}
   SFX.wrong();setPor(who,'normal',true);
   await say(who,r.wrongLine||'……你拿這個出來是想說什麼？跟我說的話根本沒有矛盾啊。','normal');
   if(S.flags.final){S.hearts--;hearts();if(S.hearts<=0)return 'dead';await N(`（判斷失誤，信用剩下 ${S.hearts} 顆心……）`)}
   else await N('（好像不對……再看看證詞跟證物哪裡對不上。）');
  }
 }
}

html,body,button,.btn,.hot,#box{touch-action:manipulation}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden}
#app{position:relative;margin:0 auto;height:100%;max-width:56.25vh;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s,filter .5s}
#rain{display:none}
#por{position:absolute;left:50%;bottom:23%;height:62%;transform:translateX(-50%);transition:opacity .25s,transform .25s;opacity:0;filter:drop-shadow(0 0 12px rgba(0,0,0,.7))}
#por.on{opacity:1}
#por.shake{animation:pshake .4s}
@keyframes pshake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(-56%)}40%{transform:translateX(-44%)}60%{transform:translateX(-53%)}80%{transform:translateX(-47%)}}
#app.shake{animation:ashake .45s}
@keyframes ashake{0%,100%{transform:none}25%{transform:translate(-8px,4px)}50%{transform:translate(7px,-5px)}75%{transform:translate(-4px,3px)}}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(#000a,#0000);z-index:5}
#place{font-weight:bold;letter-spacing:2px;text-shadow:0 2px 4px #000}
#hearts{font-size:18px}
.hb{background:#c0392b;border:2px solid #f5c26b;color:#fff;border-radius:18px;padding:6px 12px;font-size:14px;font-weight:bold;margin-left:6px}
#hs{position:absolute;inset:0;z-index:2}
.hot{position:absolute;border:2px dashed rgba(255,215,120,.8);border-radius:12px;background:rgba(255,200,80,.12);animation:glow 1.6s infinite;display:flex;align-items:flex-end;justify-content:center}
.hot span{font-size:12px;background:#000b;padding:2px 6px;border-radius:6px;margin-bottom:-12px;white-space:nowrap}
.hot.done{border-color:rgba(160,160,160,.5);background:none;animation:none}
@keyframes glow{50%{background:rgba(255,200,80,.3);box-shadow:0 0 14px #fc6}}
#box{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));min-height:21%;background:rgba(10,12,30,.88);border:2px solid #f5c26b;border-radius:14px;padding:22px 16px 14px;z-index:6;display:none;font-size:17px;line-height:1.6}
#name{position:absolute;top:-14px;left:12px;background:#b03a2e;border:2px solid #f5c26b;padding:2px 14px;border-radius:10px;font-weight:bold;font-size:15px}
#name:empty{display:none}
#txt{white-space:pre-wrap;min-height:3.2em}
#txt.test{color:#7fe08a}
#nxt{position:absolute;right:12px;bottom:6px;animation:bob 1s infinite;color:#f5c26b}
@keyframes bob{50%{transform:translateY(4px)}}
#bar{position:absolute;left:0;right:0;bottom:0;display:none;gap:6px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d 30%);z-index:4;flex-wrap:wrap;justify-content:center;pointer-events:none}

.btn{flex:1;min-width:28%;background:linear-gradient(#3a4a8a,#22295a);border:2px solid #f5c26b;color:#fff;border-radius:12px;padding:12px 6px;font-size:16px;font-weight:bold;text-align:center}
.btn.red{background:linear-gradient(#d0452f,#8a1f14)}
.btn:active{transform:scale(.96)}

.ev.pz{min-height:0;font-size:15px;line-height:1.5;padding:12px}

#modal{position:absolute;inset:0;background:rgba(0,0,0,.82);z-index:10;display:none;flex-direction:column;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}

.ev{background:#1d2347;border:2px solid #556;border-radius:10px;padding:8px;font-size:14px;min-height:64px}

#mbtns{display:flex;gap:8px}
#flash{position:absolute;inset:0;z-index:20;pointer-events:none;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 0,#ffd 30%,#f90 60%,#a00 100%)}

#title{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18%;background:linear-gradient(#0000 30%,#000c)}

#chap{position:absolute;inset:0;z-index:14;display:none;align-items:center;justify-content:center;background:#000;font-size:26px;letter-spacing:4px;color:#ffe3a0;text-align:center;line-height:1.8}

let AC=null,rainNode=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();if(!bgmCur)setBGM('inv');return AC}
function tone(f,d,type='square',v=.05,slide=0){if(!AC)return;if(v>.03)duck();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function noise(d,v=.3,f=1000){if(!AC)return;duck();const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.frequency.value=f;const g=AC.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start()}

let MB=null,DK=null,bgmOn=localStorage.getItem('laojie_bgm')!=='off',bgmCur=null,bgmT=null,step=0,nextT=0;const TH={};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function duck(){if(!DK)return;const t=AC.currentTime;DK.gain.cancelScheduledValues(t);DK.gain.setTargetAtTime(.35,t,.02);DK.gain.setTargetAtTime(1,t+.35,.25)}
function mInit(){if(MB)return;DK=AC.createGain();MB=AC.createGain();MB.gain.value=bgmOn?1:0;DK.connect(MB).connect(AC.destination);
 for(const k of ['inv','test','final']){const g=AC.createGain();g.gain.value=0;g.connect(DK);TH[k]={g}}
 nextT=AC.currentTime+.1;bgmT=setInterval(sched,40)}
function note(th,m,t,d,type,v,o={}){const c=AC,os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(mtof(m),t);
 if(o.slide)os.frequency.setValueAtTime(mtof(m-1),t),os.frequency.linearRampToValueAtTime(mtof(m),t+.08);
 let n=os;if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);n=f}
 if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.5;lg.gain.value=mtof(m)*.012;l.connect(lg).connect(os.frequency);l.start(t);l.stop(t+d+.3)}
 const a=o.a||.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);
 if(o.sus){g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d)}else g.gain.exponentialRampToValueAtTime(.0001,t+d);
 n.connect(g).connect(TH[th].g);os.start(t);os.stop(t+d+.05)}
function drum(th,t,kind,v){const c=AC;if(kind==='k'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(TH[th].g);o.start(t);o.stop(t+.25);return}
 const len=kind==='s'?.15:.04,b=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f).connect(g).connect(TH[th].g);s.start(t)}

 chords:[[50,57,62],[48,55,60],[46,53,58],[45,52,57]]};
const TST={bpm:96,bass:[45,45,45,46,45,45,48,46],stab:[69,0,0,70,0,0,69,0, 0,0,72,0,70,0,69,0]};
const FIN={bpm:138,bass:[40,40,52,40,43,43,55,43,45,45,57,45,47,47,59,47],lead:[76,0,76,79,0,76,74,0, 72,0,71,0,72,74,0,0, 76,0,76,79,0,81,79,0, 83,0,81,79,76,0,0,0, 72,0,72,74,0,76,74,72, 71,0,67,0,71,74,0,0, 76,79,81,0,79,76,74,0, 76,0,0,0,0,0,0,0]};
function sched(){if(!AC||!bgmCur)return;while(nextT<AC.currentTime+.15){play8(bgmCur,step,nextT);const bpm={inv:INV,test:TST,final:FIN}[bgmCur].bpm;nextT+=30/bpm;step++}}
function play8(th,s,t){const e=30/{inv:INV,test:TST,final:FIN}[th].bpm;
 if(th==='inv'){const ch=INV.chords[Math.floor(s/16)%4];// guitar arpeggio
  const ar=[0,1,2,1];note(th,ch[ar[s%4]]+12,t,1.2,'triangle',.06,{lp:2000});if(s%16===0)ch.forEach(m=>note(th,m,t,e*16,'sine',.025,{a:.8,sus:1}));
  const m=INV.lead[s%INV.lead.length];if(m)note(th,m,t,e*2.6,'sawtooth',.045,{lp:1500,vib:1,a:.09,sus:1,slide:1})}
 else if(th==='test'){const b=TST.bass[s%8];note(th,b,t,e*.9,'sawtooth',.07,{lp:500});if(s%2)drum(th,t,'h',.05);
  const m=TST.stab[s%16];if(m)note(th,m,t,e*.6,'square',.035,{lp:2200});if(s%32===0)note(th,57,t,e*32,'sine',.03,{a:1,sus:1})}
 else {const b=FIN.bass[s%16];note(th,b,t,e*.8,'sawtooth',.08,{lp:900});if(s%4===0)drum(th,t,'k',.5);if(s%4===2)drum(th,t,'s',.25);drum(th,t,'h',.04);
  const m=FIN.lead[s%FIN.lead.length];if(m)note(th,m,t,e*1.5,'square',.04,{lp:3500,vib:1})}}
function setBGM(k){if(!AC)return;mInit();if(k===bgmCur)return;const t=AC.currentTime;
 for(const n in TH){TH[n].g.gain.cancelScheduledValues(t);TH[n].g.gain.setValueAtTime(TH[n].g.gain.value,t);TH[n].g.gain.linearRampToValueAtTime(n===k?(n==='final'?.8:1):0,t+1.5)}
 if(k&&bgmCur!==k&&!(bgmCur&&k))step=0;bgmCur=k;window.__bgm=k}
function toggleBGM(){bgmOn=!bgmOn;localStorage.setItem('laojie_bgm',bgmOn?'on':'off');if(MB)MB.gain.setTargetAtTime(bgmOn?1:0,AC.currentTime,.1);$('#bgmBtn').textContent=bgmOn?'♪ 開':'♪ 關'}

async function say(who,t,e,opt={}){
 if(!opt.test){LOG.push([who?(CH[who]||who):'',t]);if(LOG.length>60)LOG.shift()}
 box.style.display='block';nm.textContent=(who?(CH[who]||who):'')+(opt.tag||'');txt.className=opt.test?'test':'';
 if(who&&ART[who+'_normal'])setPor(who,e||'normal',opt.shake);
 typing=true;skip=false;txt.textContent='';
 for(let i=0;i<t.length;i++){if(skip||window.__fast){txt.textContent=t;break}txt.textContent+=t[i];if(i%2==0&&t[i]!=' ')SFX.blip();await sleep(t[i]==='…'||t[i]==='。'?90:28)}
 typing=false;$('#nxt').style.display='block';
 if(opt.noWait)return;
 await new Promise(r=>waiter=r);
}

const WHERE={rust:'後倉庫的鐵門',ledger:'秀蘭茶行的櫃檯',book:'後倉庫的牆',cctv:'老街口的山城民宿',cuff:'跟林先生聊聊',cake:'後倉庫的地上',gift:'秀蘭茶行'};
function missHint(r){if(r.answer.ev.some(k=>S.ev.includes(k)))return null;return `（好像還缺關鍵證據，先去別處調查看看。提示：${WHERE[r.answer.ev[0]]||'到處看看'}）`}
async function useHint(r){
 r._h=r._h||0;
 if(r._h<2){r._h++;S.hints++;window.__hints=S.hints}
 const L=r.lines[r.answer.i];
 if(r._h===1)await N(`💡 提示 1：注意第 ${r.answer.i+1} 句——「${L.t}」\n${r.hint[0]}`);
 else {const e=r.answer.ev.map(k=>EV[k].n).join('】或【');await N(`💡 提示 2：在第 ${r.answer.i+1} 句出示【${e}】。\n${r.hint[1]}`);const h=missHint(r);if(h)await N(h)}
}
async function crossExam(who,title,r){
 let i=0;setBGM(S.flags.final?'final':'test');
 await N(`—— ${title} ——\n（點「追問」逼問細節，發現矛盾就按「出示」證物！卡關可按「💡 提示」，或「✖ 離開」先去調查。）`);
 {const h=missHint(r);if(h)await N(h)}
 while(true){
  const L=r.lines[i];
  hideBox();
  await say(who,`「${L.t}」`,L.e||'normal',{test:true,noWait:true,tag:`．證詞 ${i+1}/${r.lines.length}`});
  const tb=$('#tbar');
  const v=await new Promise(res=>{tb.innerHTML='';tb.style.display='flex';tb.style.bottom=(box.offsetHeight+18)+'px';
   let done=false;[['◀ 上一句','prev'],['追問','press'],['出示','present','red'],['下一句 ▶','next'],[`💡 提示${r._h>=2?'（已全開）':r._h?'（再一次）':''}`,'hint','r2 hint'],[S.flags.final?'✖ 先撤退（保留心數）':'✖ 離開，先去調查','leave','r2 leave']].forEach(([l,val,c])=>{const x=document.createElement('button');x.type='button';x.className='btn '+(c||'');x.dataset.act=val;x.style.minWidth='0';x.style.flex=1;x.style.padding='14px 2px';x.style.fontSize='15px';x.textContent=l;x.dataset.v=val;onTap(x,()=>{if(done)return;done=true;ac();SFX.tap();tb.style.display='none';res(val)});tb.appendChild(x)})});
  if(v==='leave'){hideBox();setPor(null);await N(S.flags.final?'（先撤退整理線索。心數會保留，準備好再按「⚖️ 指認兇手」繼續對質。）':`（先離開，晚點再找${CH[who]}談。）`);return 'leave'}
  if(v==='hint'){await useHint(r);continue}
  if(v==='prev'){i=(i-1+r.lines.length)%r.lines.length;continue}
  if(v==='next'){i++;if(i>=r.lines.length){i=0;await N('（證詞又繞回第一句了。哪一句跟證物對不上？）')}continue}
  if(v==='press'){await flash('等一下！');for(const p of (L.press||[[who,'……就是這樣，沒什麼好說的。']]))await say(p[0],p[1],p[2]);continue}
  if(v==='present'){busyModal=true;const k=await evModal('要出示哪一個證物？',true);busyModal=false;if(!k)continue;
   if(i===r.answer.i&&r.answer.ev.includes(k)){await flash('就是這個！');return k}
   SFX.wrong();setPor(who,'normal',true);S.miss++;
   await say(who,r.wrongLine||'……你拿這個出來是想說什麼？跟我說的話根本沒有矛盾啊。','normal');
   if(S.flags.final){S.hearts--;hearts();if(S.hearts<=0)return 'dead';await N(`（判斷失誤，信用剩下 ${S.hearts} 顆心……）`)}
   else await N(missHint(r)||'（好像不對……再看看證詞跟證物哪裡對不上。卡住可以按「💡 提示」。）');
  }
 }
}

 await N('🔍 點畫面上發光的地方調查；用下方按鈕跟人說話。\n📒 證物隨時可以在右上角查看；證詞卡關可以按「💡 提示」。');
 S.scene='street';
}
const SKEY='laojie';
/* ---------- save / load ---------- */
const SAVE_V=2;let lastSnap=null;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SLOTS=['auto','s1','s2','s3'],skey=s=>SKEY+'_'+s;
function chapName(){return S.flags.final?'最終對質':S.flags.ch2?'第二章':'第一章'}
function snapshot(){if(S.ended||!S.scene||!SC[S.scene])return;
 const H={};if(typeof T!=='undefined')for(const k in T)if(T[k]&&T[k]._h)H[k]=T[k]._h;
 lastSnap={v:SAVE_V,t:Date.now(),chap:chapName(),place:SC[S.scene].name,evn:S.ev.length,hearts:S.hearts,bgm:bgmOn,H,S:JSON.parse(JSON.stringify(S))};
 LS.set(skey('auto'),JSON.stringify(lastSnap))}
function readSlot(s){try{const d=JSON.parse(LS.get(skey(s)));if(!d||d.v!==SAVE_V||!d.S||!Array.isArray(d.S.ev)||!SC[d.S.scene]||typeof d.S.flags!=='object')return null;return d}catch(e){return null}}
const latest=()=>SLOTS.map(readSlot).filter(Boolean).sort((a,b)=>b.t-a.t)[0]||null;
const fmtT=t=>new Date(t).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'（台北）';
function applySave(d){for(const k of Object.keys(S))delete S[k];Object.assign(S,JSON.parse(JSON.stringify(d.S)));S.ended=false;
 if(typeof T!=='undefined')for(const k in T)if(T[k])T[k]._h=(d.H||{})[k]||0;
 if(typeof d.bgm==='boolean'&&d.bgm!==bgmOn){bgmOn=d.bgm;LS.set(SKEY+'_bgm',bgmOn?'on':'off');if(MB&&AC)MB.gain.value=bgmOn?1:0}
 $('#bgmBtn').textContent=bgmOn?'♪ 開':'♪ 關';$('#evBtn').style.display=S.ev.length?'':'none';
 $('#title').style.display='none';$('#menuBtn').style.display='';closeSv();hearts();setBg(SC[S.scene].bg);window.__fast=window.__fast||false;renderScene()}
function doLoad(d){if(started){LS.set(SKEY+'_pending',JSON.stringify(d));location.reload()}else{try{ac()}catch(e){}started=true;applySave(d)}}
let started=false;
/* overlay UI */
const sv=document.createElement('div');sv.id='sv';document.getElementById('app').appendChild(sv);
const st=document.createElement('style');st.textContent=`#sv{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.88);display:none;flex-direction:column;justify-content:center;padding:18px;gap:10px}
#sv h2{color:#f5c26b;text-align:center;margin:0 0 6px}#sv .slot{background:#1d2440;border:2px solid #f5c26b;border-radius:12px;color:#fff;padding:10px 12px;text-align:left;font-size:14px;line-height:1.5}
#sv .slot b{color:#f5c26b}#sv .slot.empty{opacity:.6}#sv .note{color:#aaa;font-size:12px;text-align:center}#sv .btn{flex:none}
#menuPop{position:absolute;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 40px);z-index:25;display:none;flex-direction:column;gap:6px;background:#0d1226ee;border:2px solid #f5c26b;border-radius:12px;padding:8px}
#menuPop .hb{margin:0;font-size:14px;padding:8px 14px;background:#2a3a6a;text-align:left}`;document.head.appendChild(st);
function closeSv(){sv.style.display='none';sv.innerHTML=''}
function ask(msg){return new Promise(r=>{sv.innerHTML=`<h2>確認</h2><div class="note" style="color:#fff;font-size:16px">${msg}</div>`;const y=document.createElement('button');y.className='btn red';y.id='svYes';y.textContent='確定';const n=document.createElement('button');n.className='btn';n.id='svNo';n.textContent='取消';y.onclick=()=>{closeSv();r(true)};n.onclick=()=>{closeSv();r(false)};sv.append(y,n);sv.style.display='flex'})}
function slotHtml(s,d){const nm=s==='auto'?'自動存檔':'存檔 '+s[1];return d?`<b>${nm}</b>　${fmtT(d.t)}<br>${d.chap}・${d.place}<br>📒 證物 ${d.evn}　❤️ ${d.hearts}/5`:`<b>${nm}</b>　（空）`}
function openSv(mode){sv.innerHTML=`<h2>${mode==='save'?'💾 存檔':'📂 讀檔'}</h2>`;
 (mode==='save'?SLOTS.slice(1):SLOTS).forEach(s=>{const d=readSlot(s),b=document.createElement('button');b.className='slot'+(d?'':' empty');b.dataset.slot=s;b.innerHTML=slotHtml(s,d);
  b.onclick=async()=>{if(mode==='save'){if(!lastSnap)return;if(d&&!(await ask(`覆蓋「存檔 ${s[1]}」？`)))return openSv('save');const o={...lastSnap,t:Date.now()};const ok=LS.set(skey(s),JSON.stringify(o));openSv('save');if(!ok)sv.querySelector('h2').textContent='⚠️ 無法存檔（私密瀏覽？）'}else if(d)doLoad(d)};sv.appendChild(b)});
 const n=document.createElement('div');n.className='note';n.textContent=mode==='save'?'會記錄最近一次回到場景畫面時的進度。':'讀檔會回到該存檔的場景畫面。';sv.appendChild(n);
 const c=document.createElement('button');c.className='btn';c.id='svClose';c.textContent='關閉';c.onclick=()=>{closeSv();refreshTitle()};sv.appendChild(c);sv.style.display='flex'}
/* ☰ menu */
(()=>{const lb=$('#logBtn'),bb=$('#bgmBtn'),m=document.createElement('button');m.className='hb';m.id='menuBtn';m.style.background='#2a3a6a';m.textContent='☰ 選單';lb.parentNode.insertBefore(m,lb);
 const p=document.createElement('div');p.id='menuPop';document.getElementById('app').appendChild(p);
 const sb=document.createElement('button');sb.className='hb';sb.id='saveBtn';sb.textContent='💾 存檔';const ldb=document.createElement('button');ldb.className='hb';ldb.id='loadBtn';ldb.textContent='📂 讀檔';
 lb.textContent='📜 回顧';p.append(sb,ldb,lb,bb);
 m.onclick=e=>{e.stopPropagation();sb.style.display=started?'':'none';p.style.display=p.style.display==='flex'?'none':'flex'};
 p.addEventListener('click',e=>{e.stopPropagation();setTimeout(()=>p.style.display='none',0)});
 sb.onclick=()=>openSv('save');ldb.onclick=()=>openSv('load')})();
/* title */
const tl=$('#tbtns'),cb=document.createElement('button'),lb2=document.createElement('button');
cb.className='btn red';cb.id='contBtn';cb.textContent='▶ 繼續遊戲';lb2.className='btn';lb2.id='titleLoadBtn';lb2.textContent='📂 讀取進度';
[cb,lb2].forEach(b=>{b.style.flex='none';b.style.width='60%';b.style.marginBottom='10px'});tl.insertBefore(lb2,$('#startBtn'));tl.insertBefore(cb,lb2);
function refreshTitle(){$('#menuBtn').style.display=started?'':'none';const h=!!latest();cb.style.display=lb2.style.display=h?'':'none';$('#startBtn').textContent=h?'新遊戲':START_TXT;$('#startBtn').className=h?'btn':'btn red'}
const START_TXT=$('#startBtn').textContent;
cb.onclick=()=>{const d=latest();if(d)doLoad(d)};lb2.onclick=()=>openSv('load');
$('#startBtn').onclick=async()=>{if(latest()&&!(await ask('開始新遊戲？<br>（存檔不會被刪除，但自動存檔會被覆蓋）')))return;started=true;$('#menuBtn').style.display='';ac();rsize();await intro();renderScene()};
const _rs=renderScene;renderScene=function(){_rs();snapshot()};
refreshTitle();
(()=>{const p=LS.get(SKEY+'_pending');if(!p)return;LS.del(SKEY+'_pending');try{const d=JSON.parse(p);if(d&&d.v===SAVE_V&&SC[d.S.scene]){started=true;applySave(d)}}catch(e){}})();

rsize();setBg('street');
</script></body></html>
